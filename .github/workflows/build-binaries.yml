name: Build ParallaxLibPacker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ultra-multivm-hardening
    paths:
      - "upx-devel/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-binaries.yml"
  pull_request:
    paths:
      - "upx-devel/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-binaries.yml"

permissions:
  contents: write

env:
  SOURCE_DIR: upx-devel

jobs:
  build-linux:
    name: Linux x64 full static
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils cmake ninja-build git file curl xz-utils perl python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3-pip \
            libc6:i386 zlib1g:i386 libmpfr6 \
            qemu-user-static libc6-arm64-cross

      - name: Download required vendor dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR/vendor"
          clone_vendor() {
            local repo="$1" dst="$2" sha="$3"
            local dir="$SOURCE_DIR/vendor/$dst"
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/upx/$repo.git"
            git -C "$dir" fetch -q --depth 1 origin "$sha"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          }
          clone_vendor upx-vendor-doctest doctest 835aaee34666173532e98437b057f37b385076c9
          clone_vendor upx-vendor-lzma-sdk lzma-sdk f9637f9f563d17b6ecf33ae2212dcd44866bfb25
          clone_vendor upx-vendor-ucl ucl a60611d342b0b7d2924c495ebaa1910e4c3c3fe6
          clone_vendor upx-vendor-valgrind valgrind b054e44ea1b6d630853ed74d33e0934ef4642efc
          clone_vendor upx-vendor-zlib zlib 0a41a7d0a974d0b43afe4afe4b8025c8f144474e

      - name: Verify Aegis signed self-integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --only-binary=:all: -r scripts/requirements-secure.txt
          python3 scripts/parallax_aegis.py status
          python3 scripts/parallax_aegis.py enforce
          python3 -m unittest -v tests.test_aegis_policy

      - name: Test PVM4 core
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/pvm4_roundtrip.c -o /tmp/pvm4-roundtrip
          /tmp/pvm4-roundtrip

      - name: Test protected-library-only runtime policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_self_only_policy

      - name: Verify Android ARM64 crash regressions
        shell: bash
        run: python3 -m unittest -v tests.test_android_startup_regression

      - name: Test native APK signing-certificate pinning parser
        shell: bash
        run: python3 -m unittest -v tests.test_apk_pin

      - name: Regenerate hardened ARM64 ELF-SO runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/rebuild-pvm4-arm64-stub.sh "$SOURCE_DIR"

      - name: Configure full-size static Linux build
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S "$SOURCE_DIR" \
            -B build-linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -D_FORTIFY_SOURCE=2 -fstack-protector-strong" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -D_FORTIFY_SOURCE=2 -fstack-protector-strong" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -Wl,-z,relro -Wl,-z,now -Wl,-z,noexecstack" \
            -DUPX_CONFIG_DISABLE_GITREV=ON \
            -DUPX_CONFIG_DISABLE_SANITIZE=ON \
            -DUPX_CONFIG_DISABLE_WERROR=ON \
            -DUPX_CONFIG_DISABLE_WSTRICT=ON \
            -DUPX_CONFIG_CMAKE_DISABLE_TEST=ON

      - name: Build Linux
        run: cmake --build build-linux --config Release --parallel

      - name: Protect real ARM64 strlen sample
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/parallax-sample.c <<'EOF'
          #include <stddef.h>
          #include <string.h>

          __attribute__((visibility("default")))
          size_t parallax_sample_strlen(const char *s) {
              return strlen(s);
          }

          __attribute__((visibility("default"), used, section(".rodata.parallax")))
          const unsigned char parallax_sample_blob[1048576] = { 0x50, 0x56, 0x4d, 0x34 };
          EOF

          aarch64-linux-gnu-gcc -fPIC -shared -O2             -Wl,-z,relro,-z,now,-z,noexecstack             -o /tmp/libparallax_sample.so /tmp/parallax-sample.c

          readelf -h /tmp/libparallax_sample.so | grep -q 'AArch64'
          readelf -d /tmp/libparallax_sample.so | grep -q 'BIND_NOW'
          aarch64-linux-gnu-readelf -Ws /tmp/libparallax_sample.so | grep -q ' strlen@'

          rm -f /tmp/libparallax_sample.protected.so /tmp/libparallax_sample.protected2.so

          # Hostile inherited options and later weak CLI switches must not
          # downgrade the centrally locked Ultra profile.
          PARALLAX='--disable-random-id --no-lzma --overlay=strip --best' \
            build-linux/upx --parallax-ultra-lib --no-lzma --overlay=strip               -o /tmp/libparallax_sample.protected.so               /tmp/libparallax_sample.so

          PARALLAX='--disable-random-id --no-lzma' \
            build-linux/upx --parallax-ultra-lib               -o /tmp/libparallax_sample.protected2.so               /tmp/libparallax_sample.so

          test -s /tmp/libparallax_sample.protected.so
          test -s /tmp/libparallax_sample.protected2.so
          if cmp -s /tmp/libparallax_sample.protected.so /tmp/libparallax_sample.protected2.so; then
            echo "ERROR: independent Ultra protection runs were byte-identical"
            exit 1
          fi
          readelf -h /tmp/libparallax_sample.protected.so | grep -q 'AArch64'

          if readelf -lW /tmp/libparallax_sample.protected.so | grep -E 'LOAD.*RWE' >/dev/null; then
            echo "ERROR: protected sample contains RWX PT_LOAD"
            exit 1
          fi

          if readelf -lW /tmp/libparallax_sample.protected.so | grep GNU_STACK | grep -q 'RWE'; then
            echo "ERROR: protected sample has executable stack"
            exit 1
          fi

          if build-linux/upx -d /tmp/libparallax_sample.protected.so                -o /tmp/should-not-restore.so >/tmp/unpack.log 2>&1; then
            echo "ERROR: public decompression unexpectedly restored protected library"
            cat /tmp/unpack.log
            exit 1
          fi
          test ! -e /tmp/should-not-restore.so

          sha256sum /tmp/libparallax_sample.so /tmp/libparallax_sample.protected.so
          echo "ARM64 PVM4 protection regression: PASS"

      - name: Verify optional APK SHA-256 certificate pin in protected ELF
        shell: bash
        run: |
          set -euo pipefail
          CERT_SHA256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          build-linux/upx --parallax-ultra-lib --apk-cert-sha256 "$CERT_SHA256" -o /tmp/libparallax_sample.pin.so /tmp/libparallax_sample.so
          test -s /tmp/libparallax_sample.pin.so
          readelf -h /tmp/libparallax_sample.pin.so | grep -q 'AArch64'
          if build-linux/upx --parallax-ultra-lib --apk-cert-sha256 INVALID -o /tmp/libparallax_bad.pin.so /tmp/libparallax_sample.so; then
            echo "ERROR: invalid signer SHA256 was accepted"
            exit 1
          fi

      - name: Runtime smoke test under qemu-user (ARM64)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/parallax-smoke.c <<'EOF'
          #include <dlfcn.h>
          #include <signal.h>
          #include <stddef.h>
          #include <stdio.h>
          #include <ucontext.h>
          #include <unistd.h>

          static void report_signal(int sig, siginfo_t *si, void *ctx) {
              ucontext_t *uc = (ucontext_t *)ctx;
              fprintf(stderr, "guest signal %d addr=%p x0=0x%lx pc=%p\n",
                      sig, si ? si->si_addr : NULL,
                      (unsigned long)uc->uc_mcontext.regs[0],
                      (void *)uc->uc_mcontext.pc);
              _exit(120 + sig);
          }

          int main(int argc, char **argv) {
              struct sigaction sa;
              void *handle;
              size_t (*fn)(const char *);
              if (argc != 2)
                  return 64;
              sa.sa_sigaction = report_signal;
              sigemptyset(&sa.sa_mask);
              sa.sa_flags = SA_SIGINFO;
              sigaction(SIGTRAP, &sa, NULL);
              sigaction(SIGSEGV, &sa, NULL);
              sigaction(SIGILL, &sa, NULL);
              handle = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
              if (!handle) {
                  fprintf(stderr, "dlopen failed: %s\n", dlerror());
                  return 1;
              }
              fn = (size_t (*)(const char *))dlsym(handle, "parallax_sample_strlen");
              if (!fn) {
                  fprintf(stderr, "dlsym failed: %s\n", dlerror());
                  return 2;
              }
              if (fn("parallax") != 8)
                  return 3;
              /* Give the 4-second watchdog at least one scheduling window. */
              sleep(6);
              if (fn("watchdog") != 8)
                  return 4;
              puts("runtime watchdog smoke: PASS");
              return 0;
          }
          EOF
          aarch64-linux-gnu-gcc -O2 -o /tmp/parallax-smoke /tmp/parallax-smoke.c -ldl
          timeout --signal=KILL 45s qemu-aarch64-static -L /usr/aarch64-linux-gnu \
            /tmp/parallax-smoke /tmp/libparallax_sample.protected.so

      - name: Validate Linux image
        shell: bash
        run: |
          set -euo pipefail
          RAW="build-linux/upx"

          echo "ELF header:"
          readelf -h "$RAW" | grep -E 'Type:|Machine:'

          echo "GNU_STACK:"
          readelf -lW "$RAW" | grep GNU_STACK

          if readelf -lW "$RAW" | grep GNU_STACK | grep -q 'RWE'; then
            echo "ERROR: executable stack detected"
            exit 1
          fi

          if readelf -lW "$RAW" | grep -E 'LOAD.*RWE' >/dev/null; then
            echo "ERROR: writable+executable LOAD segment detected"
            exit 1
          fi

          file "$RAW"
          ldd "$RAW" || true

      - name: Prepare full-size Linux binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          RAW="build-linux/upx"
          FINAL="dist/parallax_linux"

          echo "Raw Linux binary:"
          ls -lh "$RAW"
          file "$RAW"

          # Keep the original full Release executable.
          # Do NOT strip and do NOT self-pack it with UPX.
          cp "$RAW" "$FINAL"
          chmod +x "$FINAL"

          echo "Final Linux binary:"
          ls -lh "$FINAL"
          file "$FINAL"
          "$FINAL" --version

          BYTES=$(stat -c%s "$FINAL")
          MIB=$(awk "BEGIN {printf \"%.2f\", ${BYTES}/1048576}")
          echo "Final Linux size: ${BYTES} bytes (${MIB} MiB)"

          # Full-size builds naturally vary somewhat with compiler/toolchain.
          if [ "$BYTES" -lt 4194304 ] || [ "$BYTES" -gt 8388608 ]; then
            echo "WARNING: Linux binary is outside the expected 4-8 MiB full-size range."
          fi

          (cd dist && sha256sum "$(basename "$FINAL")" > "$(basename "$FINAL").sha256")
          (cd dist && sha256sum -c "$(basename "$FINAL").sha256")

      - name: Publish Linux binary to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=parallax-ultra-v3-latest
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "ParallaxLibPacker ultra v3" \
              --notes "Automated Linux x64 build from ${GITHUB_SHA}" || true
          gh release upload "$TAG" dist/parallax_linux dist/parallax_linux.sha256 --clobber

  build-linux-arm64:
    name: Linux ARM64 static (Termux/phone)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ARM64 cross build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils cmake ninja-build git file curl xz-utils perl python3 python3-pip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-user-static libc6-arm64-cross libmpfr6

      - name: Download required vendor dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR/vendor"
          clone_vendor() {
            local repo="$1" dst="$2" sha="$3"
            local dir="$SOURCE_DIR/vendor/$dst"
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/upx/$repo.git"
            git -C "$dir" fetch -q --depth 1 origin "$sha"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          }
          clone_vendor upx-vendor-doctest doctest 835aaee34666173532e98437b057f37b385076c9
          clone_vendor upx-vendor-lzma-sdk lzma-sdk f9637f9f563d17b6ecf33ae2212dcd44866bfb25
          clone_vendor upx-vendor-ucl ucl a60611d342b0b7d2924c495ebaa1910e4c3c3fe6
          clone_vendor upx-vendor-valgrind valgrind b054e44ea1b6d630853ed74d33e0934ef4642efc
          clone_vendor upx-vendor-zlib zlib 0a41a7d0a974d0b43afe4afe4b8025c8f144474e

      - name: Regenerate hardened ARM64 ELF-SO runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/rebuild-pvm4-arm64-stub.sh "$SOURCE_DIR"

      - name: Configure static ARM64 Linux build
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S "$SOURCE_DIR" \
            -B build-linux-arm64 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-aarch64-static;-L;/usr/aarch64-linux-gnu" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -D_FORTIFY_SOURCE=2 -fstack-protector-strong" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -D_FORTIFY_SOURCE=2 -fstack-protector-strong" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -Wl,-z,relro -Wl,-z,now -Wl,-z,noexecstack" \
            -DUPX_CONFIG_DISABLE_GITREV=ON \
            -DUPX_CONFIG_DISABLE_SANITIZE=ON \
            -DUPX_CONFIG_DISABLE_WERROR=ON \
            -DUPX_CONFIG_DISABLE_WSTRICT=ON \
            -DUPX_CONFIG_CMAKE_DISABLE_TEST=ON

      - name: Build ARM64 Linux
        run: cmake --build build-linux-arm64 --config Release --parallel

      - name: Validate and smoke-test ARM64 packer
        shell: bash
        run: |
          set -euo pipefail
          RAW="build-linux-arm64/upx"
          file "$RAW"
          aarch64-linux-gnu-readelf -h "$RAW" | grep -q 'AArch64'
          qemu-aarch64-static -L /usr/aarch64-linux-gnu "$RAW" --version

          cat > /tmp/parallax-sample.c <<'EOF'
          #include <stddef.h>
          #include <string.h>

          __attribute__((visibility("default")))
          size_t parallax_sample_strlen(const char *s) {
              return strlen(s);
          }

          __attribute__((visibility("default"), used, section(".rodata.parallax")))
          const unsigned char parallax_sample_blob[1048576] = { 0x50, 0x56, 0x4d, 0x34 };
          EOF
          aarch64-linux-gnu-gcc -fPIC -shared -O2 -Wl,-z,relro,-z,now,-z,noexecstack \
            -o /tmp/libparallax_sample.so /tmp/parallax-sample.c

          qemu-aarch64-static -L /usr/aarch64-linux-gnu "$RAW" \
            --parallax-ultra-lib --best \
            -o /tmp/libparallax_sample.protected.so /tmp/libparallax_sample.so
          test -s /tmp/libparallax_sample.protected.so
          aarch64-linux-gnu-readelf -h /tmp/libparallax_sample.protected.so | grep -q 'AArch64'

          cat > /tmp/parallax-smoke.c <<'EOF'
          #include <dlfcn.h>
          #include <signal.h>
          #include <stddef.h>
          #include <stdio.h>
          #include <ucontext.h>
          #include <unistd.h>

          static void report_signal(int sig, siginfo_t *si, void *ctx) {
              ucontext_t *uc = (ucontext_t *)ctx;
              fprintf(stderr, "guest signal %d addr=%p x0=0x%lx pc=%p\n",
                      sig, si ? si->si_addr : NULL,
                      (unsigned long)uc->uc_mcontext.regs[0],
                      (void *)uc->uc_mcontext.pc);
              _exit(120 + sig);
          }

          int main(int argc, char **argv) {
              struct sigaction sa;
              void *handle;
              size_t (*fn)(const char *);
              if (argc != 2)
                  return 64;
              sa.sa_sigaction = report_signal;
              sigemptyset(&sa.sa_mask);
              sa.sa_flags = SA_SIGINFO;
              sigaction(SIGTRAP, &sa, NULL);
              sigaction(SIGSEGV, &sa, NULL);
              sigaction(SIGILL, &sa, NULL);
              handle = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
              if (!handle) {
                  fprintf(stderr, "dlopen failed: %s\n", dlerror());
                  return 1;
              }
              fn = (size_t (*)(const char *))dlsym(handle, "parallax_sample_strlen");
              if (!fn) {
                  fprintf(stderr, "dlsym failed: %s\n", dlerror());
                  return 2;
              }
              if (fn("parallax") != 8)
                  return 3;
              sleep(6);
              if (fn("watchdog") != 8)
                  return 4;
              puts("ARM64 packer runtime smoke: PASS");
              return 0;
          }
          EOF
          aarch64-linux-gnu-gcc -O2 -o /tmp/parallax-smoke /tmp/parallax-smoke.c -ldl
          timeout --signal=KILL 45s qemu-aarch64-static -L /usr/aarch64-linux-gnu \
            /tmp/parallax-smoke /tmp/libparallax_sample.protected.so

      - name: Zero-source Dobby runtime smoke (ARM64)
        run: |
          set -euo pipefail
          RAW="build-linux-arm64/upx"
          aarch64-linux-gnu-gcc -O2 -fPIC -shared -Wl,-soname,libdobby_selftrust.so \
            -o /tmp/libdobby_selftrust.so tests/libdobby_selftrust.c
          aarch64-linux-gnu-gcc -O2 -fPIC -shared -Wl,-z,now \
            -Wl,-init,parallax_init -o /tmp/libparallax_auto.so \
            tests/auto_dobby_lib.c -L/tmp -ldobby_selftrust -ldl
          qemu-aarch64-static -L /usr/aarch64-linux-gnu "$RAW" \
            --parallax-ultra-lib --best \
            -o /tmp/libparallax_auto.protected.so /tmp/libparallax_auto.so
          test -s /tmp/libparallax_auto.protected.so
          aarch64-linux-gnu-gcc -O2 -o /tmp/parallax-auto-smoke \
            tests/auto_dobby_smoke.c -ldl
          LD_LIBRARY_PATH=/tmp timeout --signal=KILL 45s \
            qemu-aarch64-static -L /usr/aarch64-linux-gnu \
            /tmp/parallax-auto-smoke /tmp/libparallax_auto.protected.so

      - name: Self-trust ultra runtime smoke (ARM64)
        shell: bash
        run: |
          set -euo pipefail
          RAW="build-linux-arm64/upx"
          aarch64-linux-gnu-gcc -O2 -fPIC -shared -Wl,-z,now \
            -Wl,-init,parallax_init -o /tmp/libparallax_selftrust.so tests/selftrust_lib.c -ldl
          aarch64-linux-gnu-gcc -O2 -fPIC -shared \
            -o /tmp/libdobby_selftrust.so tests/libdobby_selftrust.c
          qemu-aarch64-static -L /usr/aarch64-linux-gnu "$RAW" \
            --parallax-ultra-lib --best \
            -o /tmp/libparallax_selftrust.protected.so /tmp/libparallax_selftrust.so
          test -s /tmp/libparallax_selftrust.protected.so
          aarch64-linux-gnu-gcc -O2 -o /tmp/parallax-selftrust-smoke \
            tests/selftrust_smoke.c -ldl
          LD_LIBRARY_PATH=/tmp timeout --signal=KILL 45s \
            qemu-aarch64-static -L /usr/aarch64-linux-gnu \
            /tmp/parallax-selftrust-smoke /tmp/libparallax_selftrust.protected.so

      - name: Prepare ARM64 Linux binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build-linux-arm64/upx dist/parallax_linux_arm64
          chmod +x dist/parallax_linux_arm64
          file dist/parallax_linux_arm64
          (cd dist && sha256sum parallax_linux_arm64 > parallax_linux_arm64.sha256)
          (cd dist && sha256sum -c parallax_linux_arm64.sha256)

      - name: Publish ARM64 binary to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=parallax-ultra-v3-latest
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "ParallaxLibPacker ultra v3" \
              --notes "Automated build from ${GITHUB_SHA}" || true
          gh release upload "$TAG" \
            dist/parallax_linux_arm64 dist/parallax_linux_arm64.sha256 --clobber


  build-windows:
    name: Windows x64 compact + hardened
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install x64 MinGW cross compiler
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64-posix \
            g++-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 \
            mingw-w64-x86-64-dev \
            cmake \
            ninja-build \
            git \
            file \
            curl \
            xz-utils \
            perl \
            python3 \
            python3-pip \
            libc6:i386 \
            zlib1g:i386 \
            libmpfr6

      - name: Download required vendor dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR/vendor"
          clone_vendor() {
            local repo="$1" dst="$2" sha="$3"
            local dir="$SOURCE_DIR/vendor/$dst"
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/upx/$repo.git"
            git -C "$dir" fetch -q --depth 1 origin "$sha"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          }
          clone_vendor upx-vendor-doctest doctest 835aaee34666173532e98437b057f37b385076c9
          clone_vendor upx-vendor-lzma-sdk lzma-sdk f9637f9f563d17b6ecf33ae2212dcd44866bfb25
          clone_vendor upx-vendor-ucl ucl a60611d342b0b7d2924c495ebaa1910e4c3c3fe6
          clone_vendor upx-vendor-valgrind valgrind b054e44ea1b6d630853ed74d33e0934ef4642efc
          clone_vendor upx-vendor-zlib zlib 0a41a7d0a974d0b43afe4afe4b8025c8f144474e

      - name: Verify Aegis signed self-integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --only-binary=:all: -r scripts/requirements-secure.txt
          python3 scripts/parallax_aegis.py status
          python3 scripts/parallax_aegis.py enforce
          python3 -m unittest -v tests.test_aegis_policy

      - name: Test PVM4 core
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/pvm4_roundtrip.c -o /tmp/pvm4-roundtrip
          /tmp/pvm4-roundtrip

      - name: Regenerate hardened ARM64 ELF-SO runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/rebuild-pvm4-arm64-stub.sh "$SOURCE_DIR"

      - name: Download official UPX 5.2.1 host compressor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-upx
          curl -fL --retry 3 \
            -o /tmp/upx.tar.xz \
            "https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-amd64_linux.tar.xz"
          echo "402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657  /tmp/upx.tar.xz" | sha256sum -c -
          tar -xJf /tmp/upx.tar.xz -C official-upx --strip-components=1
          chmod +x official-upx/upx
          official-upx/upx --version

      - name: Configure Windows x64 MinGW build
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S "$SOURCE_DIR" \
            -B build-windows \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DCMAKE_C_FLAGS_RELEASE="-Os -DNDEBUG -D_FORTIFY_SOURCE=2 -fstack-protector-strong -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS_RELEASE="-Os -DNDEBUG -D_FORTIFY_SOURCE=2 -fstack-protector-strong -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -Wl,--gc-sections -Wl,--dynamicbase -Wl,--nxcompat -s" \
            -DUPX_CONFIG_DISABLE_GITREV=ON \
            -DUPX_CONFIG_DISABLE_SANITIZE=ON \
            -DUPX_CONFIG_DISABLE_WERROR=ON \
            -DUPX_CONFIG_DISABLE_WSTRICT=ON \
            -DUPX_CONFIG_CMAKE_DISABLE_TEST=ON \
            -DUPX_CONFIG_CMAKE_DISABLE_PLATFORM_CHECK=ON

      - name: Build Windows x64
        run: cmake --build build-windows --config Release --parallel

      - name: Validate Windows image flags
        shell: bash
        run: |
          set -euo pipefail
          RAW="build-windows/upx.exe"
          x86_64-w64-mingw32-objdump -p "$RAW" | grep -E 'DllCharacteristics|HIGH_ENTROPY_VA|DYNAMIC_BASE|NX_COMPAT' || true

      - name: Strip and compress Windows binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          RAW="build-windows/upx.exe"
          FINAL="dist/ParallaxLibPacker-windows-x64.exe"

          if [ ! -f "$RAW" ]; then
            RAW=$(find build-windows -type f -iname 'upx.exe' | head -n 1)
          fi
          if [ -z "${RAW:-}" ] || [ ! -f "$RAW" ]; then
            echo "ERROR: Windows upx.exe was not produced."
            exit 1
          fi

          echo "Raw Windows binary:"
          ls -lh "$RAW"
          file "$RAW"

          x86_64-w64-mingw32-strip --strip-all "$RAW"

          echo "After strip:"
          ls -lh "$RAW"

          # Customized fork's PE loader rejects its own MinGW image, so the
          # pristine host UPX is used only for transport compression. The
          # executable shipped here is still built from this repository.
          official-upx/upx --best --lzma -o "$FINAL" "$RAW"

          echo "Final Windows binary:"
          ls -lh "$FINAL"
          file "$FINAL"
          official-upx/upx -t "$FINAL"

          BYTES=$(stat -c%s "$FINAL")
          echo "Final Windows size: ${BYTES} bytes"
          if [ "$BYTES" -gt 1572864 ]; then
            echo "ERROR: Windows binary is larger than 1.5 MiB."
            exit 1
          fi

          (cd dist && sha256sum "$(basename "$FINAL")" > "$(basename "$FINAL").sha256")
          (cd dist && sha256sum -c "$(basename "$FINAL").sha256")

      - name: Publish Windows binary to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=parallax-ultra-v3-latest
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "ParallaxLibPacker ultra v3" \
              --notes "Automated Windows x64 build from ${GITHUB_SHA}" || true
          gh release upload "$TAG" \
            dist/ParallaxLibPacker-windows-x64.exe \
            dist/ParallaxLibPacker-windows-x64.exe.sha256 --clobber
